<!DOCTYPE html>
<html lang="es">

<head>
    <title>SelfMusic</title>
    <link rel="stylesheet" href="/static/styles.css">
    <script src="/scripts/main.js" defer></script>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1"/>
</head>

<body>
    <header>
        <button type="button" id="login_btn" onclick="redirect('/login')">Iniciar Sesión</button>
        <button type="button" id="register_btn" onclick="redirect('/register')">Registrarse</button>
    </header>
    <div class="container">
        <form action="search">
            <p class="supertext">Busca algo:</p>
            <input type="text" name="value" id="value" required>
            <button type="submit">Buscar</button>
        </form>
    </div>
    <h2>{{ playlist_msg }}</h2>
    {% for playlist in playlists %}
        <button onclick="redirect('/playlist?genre={{ playlist.type }}')">{{ playlist.type }}</button>
    {% endfor %}
</body>

</html>
